name: Refresh DCC table

on:
  schedule:
    # Multiple off-peak morning attempts in Moscow time (UTC+3).
    # GitHub cron can be delayed; more independent attempts reduce staleness.
    - cron: "7,37 6 * * *"  # 09:07 / 09:37 MSK
    - cron: "7,37 7 * * *"  # 10:07 / 10:37 MSK
    - cron: "7,37 8 * * *"  # 11:07 / 11:37 MSK
    - cron: "7 9 * * *"     # 12:07 MSK late-ESPN backup
    - cron: "7 10 * * *"    # 13:07 MSK control

  push:
    branches:
      - main
    paths:
      - "scrape.py"
      - "refresh_league.py"
      - "league_export.py"
      - "nhl_radar.py"
      - "requirements.txt"
      - ".github/workflows/refresh.yml"
      - "refresh-kick.txt"

  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    concurrency:
      group: dcc-refresh
      cancel-in-progress: false

    outputs:
      changed: ${{ steps.commit.outputs.changes_detected }}
      retry_needed: ${{ steps.freshness.outputs.retry_needed }}

    steps:
      - uses: actions/checkout@v4

      # A manually re-run workflow starts from the original run's old commit.
      # Refresh main before collecting new stats to avoid non-fast-forward pushes.
      - name: Synchronize checkout with current main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Pull ESPN category totals
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scrape.py

      - name: Pull ESPN rosters and free agents
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python refresh_league.py

      - name: Build personal NHL Fantasy Radar
        run: python nhl_radar.py --strict

      # Backup to the separate daily_impact workflow: GitHub sometimes drops
      # scheduled starts entirely. Calculate impact inside a working ESPN
      # refresh during the 05:00-13:59 Moscow window (UTC 02-10).
      # Always calculate for manually dispatched and pushed refresh workflows.
      - name: Calculate DCC daily impact as part of morning refresh
        shell: bash
        run: |
          hour=$(date -u +%H)
          if [[ "${{ github.event_name }}" != "schedule" ]] || (( 10#$hour >= 2 && 10#$hour <= 10 )); then
            python daily_impact.py
          else
            echo "Outside DCC morning impact window; skipping."
          fi

      - name: Commit updated dashboard data
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json analysis.json nhl_schedule.json players/*.json ducks-radar-7c91e4f2/*.json

          if git diff --cached --quiet; then
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
            echo "No dashboard data changes to publish."
            exit 0
          fi

          git commit -m "Update DCC ESPN data"

          for attempt in 1 2 3; do
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "changes_detected=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              git rebase --abort || true
            fi

            echo "Push race on attempt $attempt; retrying from latest main."
            sleep 4
          done

          echo "::error::Could not publish refreshed DCC data after 3 attempts."
          exit 1

      - name: Determine if ESPN needs another check
        id: freshness
        shell: bash
        run: |
          today=$(TZ=Europe/Moscow date +%F)
          hour=$(TZ=Europe/Moscow date +%H)
          updated=$(python -c 'import json; print(json.load(open("data.json")).get("updated", "")[:10])')
          if [[ "$updated" != "$today" ]] && (( 10#$hour >= 8 && 10#$hour < 16 )); then
            echo "retry_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "retry_needed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: refresh

    if: needs.refresh.outputs.changed == 'true'

    runs-on: ubuntu-latest

    concurrency:
      group: pages
      cancel-in-progress: true

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: .

      # GitHub's upload API can complete before the artifact appears in
      # the artifacts-list API, causing deploy-pages to report "Found 0".
      - name: Wait for uploaded Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_ARTIFACT: github-pages-${{ github.run_attempt }}
        shell: bash
        run: |
          for attempt in {1..15}; do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[].name' | grep -Fxq "$PAGE_ARTIFACT"; then
              echo "Artifact $PAGE_ARTIFACT is visible."
              exit 0
            fi
            echo "Waiting for Pages artifact indexing ($attempt/15)"
            sleep 3
          done
          echo "::error::Pages artifact was not visible after 45 seconds."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  retry-totals:
    # A successful early refresh can receive yesterday's ESPN scores.
    # Keep one independent runner checking rather than relying on later cron
    # starts. Roster, radar and the first deployment do not wait for this job.
    needs: refresh
    if: needs.refresh.outputs.retry_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    concurrency:
      group: dcc-totals-retry
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.poll.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Poll ESPN until actual totals change
        id: poll
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        shell: bash
        run: |
          echo "changed=false" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          today=$(TZ=Europe/Moscow date +%F)

          for attempt in {1..31}; do
            # Never overwrite a newer concurrent refresh. Re-read main
            # before every attempt, including after a rejected push.
            git fetch origin main
            git reset --hard origin/main

            now=$(TZ=Europe/Moscow date +%F)
            hour=$(TZ=Europe/Moscow date +%H)
            updated=$(python -c 'import json; print(json.load(open("data.json")).get("updated", "")[:10])')
            if [[ "$updated" == "$today" ]]; then
              echo "Today's changed ESPN totals are already on main."
              exit 0
            fi
            if [[ "$now" != "$today" ]] || (( 10#$hour >= 16 )); then
              echo "::warning::ESPN retry window ended without today's changed totals."
              exit 0
            fi

            echo "ESPN retry $attempt/31 at $(TZ=Europe/Moscow date '+%F %T') MSK"
            if python scrape.py; then
              git add data.json
              if ! git diff --cached --quiet; then
                git commit -m "Update DCC ESPN totals after retry"
                if git push origin HEAD:main; then
                  echo "changed=true" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                echo "::warning::Concurrent push; retrying from current main."
              fi
            else
              echo "::warning::ESPN request failed; retrying."
            fi
            if (( attempt < 31 )); then sleep 600; fi
          done
          echo "::warning::No changed ESPN totals within the retry window."

  deploy-retried:
    needs: retry-totals
    if: needs.retry-totals.outputs.changed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-totals-${{ github.run_attempt }}
          path: .
      - name: Wait for uploaded Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_ARTIFACT: github-pages-totals-${{ github.run_attempt }}
        shell: bash
        run: |
          for attempt in {1..15}; do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[].name' | grep -Fxq "$PAGE_ARTIFACT"; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::Retry Pages artifact was not visible."
          exit 1
      - name: Deploy retried totals
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-totals-${{ github.run_attempt }}
