name: Refresh DCC table

on:
  schedule:
    # Every hour at :54
    - cron: "54 * * * *"

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    concurrency:
      group: dcc-refresh
      cancel-in-progress: false

    outputs:
      changed: ${{ steps.commit.outputs.changes_detected }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Pull ESPN category totals
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scrape.py

      - name: Pull ESPN rosters and free agents
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python refresh_league.py

      - name: Build NHL Fantasy Radar
        run: python nhl_radar.py

      - name: Commit updated dashboard data
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update DCC dashboard data"
          file_pattern: "data.json analysis.json nhl_schedule.json players/*.json nhl/*.json"

  deploy:
    needs: refresh

    if: needs.refresh.outputs.changed == 'true'

    runs-on: ubuntu-latest

    concurrency:
      group: pages
      cancel-in-progress: true

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
