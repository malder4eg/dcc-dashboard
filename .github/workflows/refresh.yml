name: Refresh DCC table

on:
  schedule:
    # Fixed refreshes in Moscow time (UTC+3):
    # 09:00, 10:00 and 13:00 MSK.
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
    - cron: "0 10 * * *"

  push:
    branches:
      - main
    paths:
      - "scrape.py"
      - "refresh_league.py"
      - "league_export.py"
      - "nhl_radar.py"
      - "requirements.txt"
      - ".github/workflows/refresh.yml"

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    concurrency:
      group: dcc-refresh
      cancel-in-progress: false

    outputs:
      changed: ${{ steps.commit.outputs.changes_detected }}

    steps:
      - uses: actions/checkout@v4

      # A manually re-run workflow starts from the original run's old commit.
      # Refresh main before collecting new stats to avoid non-fast-forward pushes.
      - name: Synchronize checkout with current main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Pull ESPN category totals
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scrape.py

      - name: Pull ESPN rosters and free agents
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python refresh_league.py

      - name: Build personal NHL Fantasy Radar
        run: python nhl_radar.py

      # Backup to the separate daily_impact workflow: GitHub sometimes drops
      # scheduled starts entirely. Calculate impact inside a working ESPN
      # refresh during the 05:00-13:59 Moscow window (UTC 02-10).
      # Always calculate for manually dispatched and pushed refresh workflows.
      - name: Calculate DCC daily impact as part of morning refresh
        shell: bash
        run: |
          hour=$(date -u +%H)
          if [[ "${{ github.event_name }}" != "schedule" ]] || (( 10#$hour >= 2 && 10#$hour <= 10 )); then
            python daily_impact.py
          else
            echo "Outside DCC morning impact window; skipping."
          fi

      - name: Commit updated dashboard data
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update DCC ESPN data"
          file_pattern: "data.json analysis.json nhl_schedule.json players/*.json ducks-radar-7c91e4f2/*.json"

  deploy:
    needs: refresh

    if: needs.refresh.outputs.changed == 'true'

    runs-on: ubuntu-latest

    concurrency:
      group: pages
      cancel-in-progress: true

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
