name: DCC daily fantasy impact

on:
  schedule:
    # The DCC briefing now runs at 08:30 Moscow. GitHub schedules may be
    # delayed, so start early and retry; retain later runs as fallback.
    # Moscow is UTC+3 year round. Some west-coast NHL games may still be live:
    # daily_impact.py marks incomplete scores, do not assume full coverage.
    - cron: "12,42 4 * * *"  # 07:12 and 07:42 MSK
    - cron: "12,42 5 * * *"  # 08:12 and 08:42 MSK
    - cron: "12 6 * * *"     # 09:12 MSK fallback
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "daily_impact.py"
      - ".github/workflows/daily_impact.yml"

permissions:
  contents: write

jobs:
  impact:
    runs-on: ubuntu-latest
    concurrency:
      group: dcc-refresh
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      # A delayed or manually retried run must always use the newest ESPN
      # ownership and NHL collector code from main, not an older workflow SHA.
      - name: Synchronize checkout with current main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh NHL skater statistics
        run: python nhl_radar.py --strict

      - name: Rank all completed NHL games for DCC
        run: python daily_impact.py

      - name: Publish personal daily impact snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ducks-radar-7c91e4f2/*.json
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "Update DCC daily fantasy impact"
          # The hourly DCC refresh can push while this job calculates.
          # Rebase the finished snapshot on the latest main before pushing.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying"
            sleep 3
          done
          exit 1
