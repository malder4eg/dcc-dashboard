name: DCC daily fantasy impact

on:
  schedule:
    # GitHub scheduled workflows may start late (e.g. 50 minutes on Nov 3).
    # Retry the same Moscow-yesterday game date at 08:12, 08:42 and 09:12 MSK (UTC+3).
    # Early incomplete snapshots will be recomputed as NHL games become final.
    # Keep all three away from minute 0 to reduce GitHub Actions scheduler congestion.
    - cron: "12,42 5 * * *"
    - cron: "12 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "daily_impact.py"
      - ".github/workflows/daily_impact.yml"

permissions:
  contents: write

jobs:
  impact:
    runs-on: ubuntu-latest
    concurrency:
      group: dcc-refresh
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh NHL skater statistics
        run: python nhl_radar.py

      - name: Rank all completed NHL games for DCC
        run: python daily_impact.py

      - name: Publish personal daily impact snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ducks-radar-7c91e4f2/*.json
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "Update DCC daily fantasy impact"
          # The hourly DCC refresh can push while this job calculates.
          # Rebase the finished snapshot on the latest main before pushing.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying"
            sleep 3
          done
          exit 1
